<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bières S&S">
<meta name="theme-color" content="#0C0803">
<title>Bières S&S 🍺</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{--gold:#F2A91E;--amber:#D4860A;--dark:#0C0803;--dark2:#1A1208;--mid:#6B4C2A;--cream:#FFF8E7;--green:#81c784;--red:#ef9a9a;--blue:#64b5f6;--purple:#ce93d8;--border:rgba(212,134,10,0.18);}
.light-mode{--dark:#F5F0E8;--dark2:#EDE6D6;--cream:#1A1208;--mid:#8B6914;--border:rgba(139,105,20,0.2);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{background:var(--dark);font-family:'Nunito',sans-serif;color:var(--cream);max-width:480px;margin:0 auto;min-height:100vh;transition:background .3s,color .3s;}
button{cursor:pointer;font-family:'Nunito',sans-serif;border:none;outline:none;}
input,textarea{font-family:'Nunito',sans-serif;outline:none;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:rgba(242,169,30,0.2);border-radius:2px;}
#notif{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:30px;font-weight:800;font-size:13px;z-index:9999;color:#1A1208;letter-spacing:1px;box-shadow:0 4px 20px rgba(0,0,0,0.5);white-space:nowrap;pointer-events:none;display:none;transition:opacity .3s;}
#loader{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8888;}
#loader span{font-size:64px;animation:pulse 1s ease-in-out infinite;}
#loader p{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:4px;color:var(--amber);margin-top:10px;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}

/* CONFETTIS */
.confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9998;overflow:hidden;}
.confetti-piece{position:absolute;width:8px;height:8px;top:-10px;border-radius:2px;animation:confettiFall linear forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}

/* HERO */
.hero{margin:20px 14px 0;background:linear-gradient(160deg,#1e1508,#0C0803);border:1px solid rgba(212,134,10,0.3);border-radius:22px;padding:24px 16px 20px;text-align:center;}
.orn{font-family:'Bebas Neue',cursive;font-size:10px;color:rgba(212,134,10,0.4);letter-spacing:3px;margin-bottom:12px;}
.logo-row{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-bottom:12px;}
.beer-wrap{position:relative;width:42px;height:76px;flex-shrink:0;}
.bstream{position:absolute;top:0;left:50%;transform:translateX(-50%);width:6px;background:linear-gradient(180deg,#F2A91E,rgba(212,134,10,0.4));border-radius:3px;height:0;animation:bstream 3s ease-in-out infinite;z-index:3;}
.bglass{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:34px;height:52px;border:2px solid rgba(242,169,30,0.7);border-top:none;border-radius:0 0 9px 9px;overflow:hidden;background:rgba(255,255,255,0.03);}
.bglass::after{content:'';position:absolute;right:-9px;top:7px;width:9px;height:18px;border:2px solid rgba(242,169,30,0.55);border-left:none;border-radius:0 7px 7px 0;}
.bliq{position:absolute;bottom:0;left:0;right:0;height:0;background:linear-gradient(180deg,rgba(242,169,30,0.95),rgba(155,75,0,0.9));animation:bliq 3s ease-in-out infinite;}
.bfoam{position:absolute;top:0;left:-2px;right:-2px;height:11px;background:rgba(255,255,255,0.87);border-radius:5px 5px 0 0;opacity:0;animation:bfoam 3s ease-in-out infinite;}
.bub{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,220,80,0.7);animation:bub 3s ease-in-out infinite;}
.bub:nth-child(2){left:7px;animation-delay:.3s;width:2px;height:2px;}
.bub:nth-child(3){left:17px;animation-delay:.55s;}
@keyframes bstream{0%{height:0;opacity:0;}8%{height:22px;opacity:1;}58%{height:22px;opacity:1;}68%,100%{height:0;opacity:0;}}
@keyframes bliq{0%{height:0;}62%{height:80%;}78%{height:80%;}100%{height:0;}}
@keyframes bfoam{0%,46%{opacity:0;}56%{opacity:1;}74%{opacity:1;transform:translateY(-1px);}90%,100%{opacity:0;transform:translateY(-4px);}}
@keyframes bub{0%,38%{bottom:2px;opacity:0;}48%{opacity:.8;}72%{bottom:55%;opacity:.3;}78%,100%{opacity:0;}}
.ss{font-family:'Playfair Display',serif;font-size:68px;color:var(--gold);line-height:1;font-style:italic;font-weight:700;text-shadow:0 0 28px rgba(242,169,30,0.3),0 2px 6px rgba(0,0,0,0.6);letter-spacing:-2px;}
.ss-amp{font-size:38px;color:var(--amber);vertical-align:middle;margin:0 2px;}
.ss-mar{font-size:10px;letter-spacing:7px;color:rgba(212,134,10,0.65);text-transform:uppercase;margin-top:2px;font-family:'Nunito',sans-serif;font-weight:400;font-style:normal;}
.hdiv{display:flex;align-items:center;gap:10px;margin:10px 0;}
.hdivl{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(212,134,10,0.3),transparent);}
.hdivm{width:5px;height:5px;background:var(--amber);transform:rotate(45deg);opacity:.55;flex-shrink:0;}
.htitle{font-family:'Bebas Neue',cursive;font-size:48px;letter-spacing:11px;color:var(--gold);line-height:1;text-shadow:0 0 28px rgba(242,169,30,0.25);text-indent:11px;}
.hlove{font-size:11px;letter-spacing:5px;color:var(--amber);font-style:italic;margin-top:5px;}
.hmodel{display:inline-block;margin-top:8px;background:rgba(242,169,30,0.09);border:1px solid rgba(242,169,30,0.22);border-radius:20px;padding:3px 13px;font-size:12px;color:var(--gold);font-style:italic;}

/* JAUGE FÛT */
.fut-gauge-wrap{margin:8px 14px 0;display:flex;gap:8px;}
.fut-gauge{flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:10px 12px;position:relative;overflow:hidden;min-height:90px;}
.fut-gauge-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(242,169,30,0.3),rgba(212,134,10,0.5));transition:height .8s ease;border-radius:0 0 13px 13px;}
.fut-gauge-fill.blue{background:linear-gradient(180deg,rgba(100,181,246,0.2),rgba(100,181,246,0.4));}
.fgc{position:relative;z-index:1;text-align:center;}
.fgl{font-family:'Bebas Neue',cursive;font-size:10px;letter-spacing:2px;color:var(--amber);display:block;}
.fgl.blue{color:var(--blue);}
.fgp{font-family:'Bebas Neue',cursive;font-size:26px;color:var(--gold);line-height:1;}
.fgp.blue{color:var(--blue);}
.fgi{font-size:10px;color:var(--mid);margin-top:1px;}
.fga{font-size:10px;color:var(--red);font-weight:800;margin-top:2px;animation:blink 1s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* SOIRÉE EN COURS */
.soiree-banner{margin:8px 14px 0;background:linear-gradient(135deg,rgba(242,169,30,0.12),rgba(212,134,10,0.06));border:1px solid rgba(242,169,30,0.3);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;}
.soiree-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(129,199,116,0.6);animation:blink .8s ease-in-out infinite;flex-shrink:0;}
.soiree-txt{font-family:'Bebas Neue',cursive;font-size:14px;letter-spacing:2px;color:var(--gold);}
.soiree-sub{font-size:11px;color:var(--mid);}
.soiree-chrono{font-family:'Bebas Neue',cursive;font-size:20px;color:var(--gold);letter-spacing:2px;margin-left:auto;}

/* ANNONCE */
.ann-banner{margin:8px 14px 0;background:rgba(206,147,216,0.08);border:1px solid rgba(206,147,216,0.25);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;}

/* ROULETTE */
.roulette-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:8000;display:flex;align-items:center;justify-content:center;}
.roulette-card{background:var(--dark2);border:1px solid rgba(242,169,30,0.3);border-radius:24px;padding:32px 24px;text-align:center;width:300px;box-shadow:0 0 60px rgba(242,169,30,0.15);}
.roulette-wheel{font-size:60px;display:block;margin:0 auto 16px;animation:spin 2s ease-out forwards;}
@keyframes spin{0%{transform:rotate(0);}80%{transform:rotate(1080deg);}100%{transform:rotate(1080deg);}}
.roulette-winner{font-family:'Bebas Neue',cursive;font-size:32px;color:var(--gold);letter-spacing:3px;margin:8px 0;}
.roulette-sub{font-size:13px;color:var(--mid);}

/* ÉQUIPES */
.teams-wrap{display:flex;gap:8px;margin:8px 14px 0;}
.team-card{flex:1;border-radius:14px;padding:10px 12px;text-align:center;border:1px solid;}
.team-name{font-family:'Bebas Neue',cursive;font-size:13px;letter-spacing:2px;}
.team-score{font-family:'Bebas Neue',cursive;font-size:36px;line-height:1;}
.team-members{font-size:10px;color:var(--mid);margin-top:3px;line-height:1.4;}

/* GENERAL */
.page{min-height:100vh;padding-bottom:68px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--dark2);position:sticky;top:0;z-index:10;}
.topbar-title{font-family:'Bebas Neue',cursive;font-size:17px;letter-spacing:3px;color:var(--gold);}
.topbar-back{background:none;color:var(--gold);font-size:13px;font-weight:700;width:70px;text-align:left;}
.topbar-quit{background:none;color:var(--gold);font-size:13px;font-weight:700;}
.bloc{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.065);border-radius:16px;overflow:hidden;margin-bottom:8px;}
.bloc-title{font-family:'Bebas Neue',cursive;font-size:13px;letter-spacing:3px;color:var(--amber);padding:10px 14px 6px;border-bottom:1px solid rgba(255,255,255,0.05);}
.ligne{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,0.035);}
.ligne-hi{background:rgba(242,169,30,0.05);}
.llbl{font-size:13px;color:var(--mid);}
.lval{font-size:13px;font-weight:700;color:var(--cream);}
.lval-hi{color:var(--gold)!important;}
.lval-blue{color:var(--blue)!important;}

/* LOGIN */
.sub{font-family:'Bebas Neue',cursive;font-size:17px;letter-spacing:5px;color:var(--amber);text-align:center;padding:12px 0 4px;}
.fut-info{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 14px 10px;}
.fut-badge{background:rgba(242,169,30,0.08);border:1px solid rgba(242,169,30,0.2);border-radius:20px;padding:4px 14px;font-size:11px;color:var(--amber);}
.fut-badge2{background:rgba(100,181,246,0.07);border:1px solid rgba(100,181,246,0.2);border-radius:20px;padding:4px 14px;font-size:11px;color:var(--blue);}
.slbl{font-family:'Bebas Neue',cursive;font-size:13px;letter-spacing:4px;color:var(--mid);padding:12px 16px 8px;}
.name-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px;}
.name-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:9px 12px;color:var(--cream);}
.name-btn:active{background:rgba(242,169,30,0.08);}
.nava{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--gold));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.ntxt{flex:1;font-size:13px;font-weight:700;text-align:left;}
.ncount{font-family:'Bebas Neue',cursive;font-size:15px;color:var(--gold);}
.admin-lnk{display:block;margin:16px auto 6px;background:none;border:1px solid rgba(212,134,10,0.2);border-radius:10px;color:var(--mid);font-size:13px;padding:10px 28px;letter-spacing:1px;}
.avatar-picker{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;justify-content:center;}
.av-btn{font-size:28px;width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,0.03);border:2px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;}
.av-btn.selected,.av-btn:active{border-color:var(--gold);background:rgba(242,169,30,0.12);}
.pin-wrap{padding:28px 24px;text-align:center;}
.pin-title{font-family:'Bebas Neue',cursive;font-size:22px;letter-spacing:6px;color:var(--amber);margin-bottom:22px;}
.pin-dots{display:flex;justify-content:center;gap:16px;margin-bottom:10px;}
.pin-dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(242,169,30,0.3);background:rgba(255,255,255,0.1);transition:all .2s;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:250px;margin:14px auto;}
.pin-btn{height:62px;border-radius:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:var(--cream);font-family:'Bebas Neue',cursive;font-size:28px;letter-spacing:2px;}
.pin-btn:active{background:rgba(242,169,30,0.12);}
.pin-back{background:none;color:var(--mid);font-size:13px;margin-top:14px;letter-spacing:1px;}

/* HOME */
.my-card{margin:12px 14px 8px;background:rgba(242,169,30,0.06);border:1px solid rgba(242,169,30,0.18);border-radius:18px;padding:16px;text-align:center;}
.my-lbl{font-size:10px;letter-spacing:3px;color:var(--amber);text-transform:uppercase;margin-bottom:4px;}
.my-big{font-family:'Bebas Neue',cursive;font-size:72px;color:var(--gold);line-height:1;text-shadow:0 0 28px rgba(242,169,30,0.22);}
.my-due{font-size:14px;font-weight:700;margin-top:3px;}
.my-real{font-size:11px;color:var(--mid);margin-top:2px;}
.my-badges{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px;}
.badge{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:3px 10px;font-size:11px;display:flex;align-items:center;gap:4px;}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 14px 8px;}
.tri-c{background:rgba(255,255,255,0.025);border:1px solid;border-radius:12px;padding:9px 5px;text-align:center;}
.tri-v{font-family:'Bebas Neue',cursive;font-size:17px;letter-spacing:1px;line-height:1;}
.tri-l{font-size:10px;color:var(--mid);margin-top:3px;letter-spacing:.5px;}
.acts{display:flex;flex-direction:column;gap:7px;padding:0 14px;}
.act{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:12px 15px;}
.act:active{background:rgba(255,255,255,0.05);}
.act-gold{background:rgba(242,169,30,0.06)!important;border-color:rgba(242,169,30,0.3)!important;}
.act-purple{background:rgba(206,147,216,0.06)!important;border-color:rgba(206,147,216,0.3)!important;}
.act-ico{font-size:22px;flex-shrink:0;}
.act-lbl{font-size:14px;font-weight:800;color:var(--cream);}
.act-sub{font-size:11px;color:var(--mid);margin-top:1px;}
.fsync{text-align:center;font-size:10px;color:#3D2B1F;letter-spacing:1px;padding:10px 0 4px;}

/* SAISIE */
.saisie-wrap{padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
.tot-ban{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(242,169,30,0.07);border:1px solid rgba(242,169,30,0.18);border-radius:14px;}
.day-row{border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.02);}
.day-today{background:rgba(242,169,30,0.06)!important;border-color:rgba(242,169,30,0.3)!important;}
.day-name{font-size:14px;font-weight:700;}
.today-tag{font-size:9px;color:var(--gold);letter-spacing:2px;font-weight:800;margin-top:2px;}
.ctr{display:flex;align-items:center;gap:11px;}
.bminus{width:44px;height:44px;border-radius:50%;border:2px solid rgba(239,154,154,0.4);background:rgba(239,154,154,0.06);color:var(--red);font-size:24px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.bminus:active{background:rgba(239,154,154,0.15);}
.cval{font-family:'Bebas Neue',cursive;font-size:36px;letter-spacing:2px;min-width:34px;text-align:center;color:rgba(255,255,255,0.18);}
.cval-on{color:var(--gold)!important;}
.bplus{width:44px;height:44px;border-radius:50%;border:2px solid rgba(129,199,116,0.4);background:rgba(129,199,116,0.06);color:var(--green);font-size:24px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.bplus:active{background:rgba(129,199,116,0.15);}
.reactions-row{display:flex;gap:5px;padding:3px 14px 8px;flex-wrap:wrap;}
.react-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:4px 9px;font-size:13px;display:flex;align-items:center;gap:3px;color:var(--cream);}
.react-btn.active{background:rgba(242,169,30,0.15);border-color:rgba(242,169,30,0.4);}
.react-count{font-size:10px;color:var(--mid);}

/* GRAPH */
.graph-wrap{padding:10px 14px 14px;}
.graph-bars{display:flex;align-items:flex-end;gap:6px;height:80px;}
.graph-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.graph-bar{width:100%;background:linear-gradient(180deg,var(--gold),var(--amber));border-radius:4px 4px 0 0;min-height:3px;transition:height .4s;}
.graph-lbl{font-size:9px;color:var(--mid);}
.graph-val{font-family:'Bebas Neue',cursive;font-size:13px;color:var(--gold);}

/* RECAP */
.scroll{padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.rank-row{display:flex;align-items:center;gap:5px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,0.035);}
.rank-me{background:rgba(242,169,30,0.04);}
.ri{font-size:14px;width:22px;text-align:right;flex-shrink:0;}
.rn{width:70px;font-size:11px;font-weight:700;flex-shrink:0;}
.rb{flex:1;height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;}
.rbf{height:100%;background:linear-gradient(90deg,var(--amber),var(--gold));border-radius:3px;}
.rv{font-family:'Bebas Neue',cursive;font-size:18px;width:24px;text-align:right;flex-shrink:0;}
.re{font-size:10px;color:var(--mid);width:40px;text-align:right;flex-shrink:0;}

/* TCHAT */
.chat-msgs{display:flex;flex-direction:column;gap:8px;padding:10px 12px;overflow-y:auto;}
.chat-msg{display:flex;gap:8px;align-items:flex-start;}
.chat-ava{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.chat-bubble{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:0 14px 14px 14px;padding:7px 11px;max-width:76%;}
.chat-bubble.mine{background:rgba(242,169,30,0.1);border-color:rgba(242,169,30,0.25);}
.chat-name{font-size:10px;color:var(--amber);font-weight:700;margin-bottom:2px;}
.chat-text{font-size:13px;color:var(--cream);line-height:1.4;}
.chat-time{font-size:9px;color:var(--mid);margin-top:2px;}
.chat-input-wrap{display:flex;gap:8px;padding:8px 12px;border-top:1px solid rgba(255,255,255,0.06);}
.chat-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:9px 14px;color:var(--cream);font-size:13px;}
.chat-send{width:40px;height:40px;border-radius:50%;background:rgba(242,169,30,0.15);border:1px solid rgba(242,169,30,0.3);color:var(--gold);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ADMIN */
.admin-badge{margin:8px 12px;background:rgba(242,169,30,0.07);border:1px solid rgba(242,169,30,0.2);border-radius:10px;padding:7px 14px;font-size:12px;color:var(--amber);text-align:center;}

.cfg-in:focus{border-color:var(--gold);}
.cfg-in-txt{background:rgba(255,255,255,0.05);border:1px solid rgba(242,169,30,0.22);border-radius:8px;color:var(--cream);font-size:13px;padding:7px 11px;width:calc(100% - 28px);margin:0 14px;}

.save-btn{margin:8px 14px;background:rgba(129,199,116,0.08);border:1px solid rgba(129,199,116,0.28);border-radius:10px;color:var(--green);font-size:13px;font-weight:700;letter-spacing:1px;padding:10px;width:calc(100% - 28px);}

.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;color:#6B4C2A;position:relative;}

<body>
<div id="notif"></div>
<div id="loader"><span>🍺</span><p>Connexion...</p></div>
<div id="app" style="display:none;padding-bottom:58px;"></div>
<div id="confetti-container"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,onValue,set,push}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FB={apiKey:"AIzaSyBdmzcmnUd4nTRS53m40ArT6WnLvgSdyew",authDomain:"beer-conso.firebaseapp.com",projectId:"beer-conso",storageBucket:"beer-conso.firebasestorage.app",messagingSenderId:"247215118379",appId:"1:247215118379:web:98c025e40ca9c4392db26e",databaseURL:"https://beer-conso-default-rtdb.europe-west1.firebasedatabase.app"};
const db=getDatabase(initializeApp(FB));
const CREF=ref(db,"bieres/counts"),CFGREF=ref(db,"bieres/config"),CHATREF=ref(db,"bieres/chat"),REACTREF=ref(db,"bieres/reactions"),AVREF=ref(db,"bieres/avatars"),ANNREF=ref(db,"bieres/annonce");

const ADMIN="1414";
const NAMES=["Seb","Solène","Éliane","Joël","Marie Claude","Alain","Marion","Ludo","Matt","Laura","David","Fabien","Sophie","Diego","Sophie D","Pauline","Xavier","Rico","Mag","Stephan","Laura D","Kiki","Wojtek","Joelle"];
const DAYS=[{s:"Mar 23",f:"Mardi 23"},{s:"Mer 24",f:"Mercredi 24"},{s:"Jeu 25",f:"Jeudi 25"},{s:"Ven 26",f:"Vendredi 26"},{s:"Lun 29",f:"Lundi 29"},{s:"Mar 30",f:"Mardi 30"}];
const TIDX=(()=>{const d=new Date().getDate(),m={23:0,24:1,25:2,26:3,29:4,30:5};return d in m?m[d]:-1;})();
const EMOJIS=["🍺","🎉","🥂","🎸","🌟","🦁","🐯","🦊","🐸","🦄","🍕","🌈","🎯","🔥","💎","🎪","🐙","🦋","🌺","🏆","⚡","🎭","🌊","🎨"];
const REACT_EMOJIS=["🍺","🔥","😂","💀","👑","🎉"];
const BADGE_DEFS=[{id:"first5",icon:"🥇",label:"Premiers 5",check:t=>t>=5},{id:"ten",icon:"🔟",label:"10 verres",check:t=>t>=10},{id:"king",icon:"👑",label:"Roi du fût",check:(t,rank)=>rank===0&&t>0},{id:"streak",icon:"🔥",label:"Assidu",check:(t,r,s)=>s>=3}];
// Équipes fixes
const TEAM1={name:"ÉQUIPE A",members:["Seb","Ludo","Matt","Diego","Xavier","Kiki","Wojtek","Joelle","Alain","Marion","Stephan","Rico"],color:"rgba(242,169,30,0.12)",border:"rgba(242,169,30,0.3)",textColor:"var(--gold)"};
const TEAM2={name:"ÉQUIPE B",members:["Solène","Éliane","Joël","Marie Claude","Laura","David","Fabien","Sophie","Sophie D","Pauline","Mag","Laura D"],color:"rgba(100,181,246,0.1)",border:"rgba(100,181,246,0.3)",textColor:"var(--blue)"};

let counts={},cfg={p1:65,l1:14,n1:"",p2:65,l2:14,n2:"",f2:false};
let avatars={},chatMsgs=[],reactions={},annonce=null;
let isAdmin=false,user=null,screen="login",subScreen="home";
let unreadChat=0,lastChatSeen=0,lightMode=false;
let earnedBadges={};

const init=()=>{const o={};NAMES.forEach(n=>{o[n]=new Array(DAYS.length).fill(0);});return o;};
counts=init();

const gpf=l=>Math.round(((l||14)*100)/25);
const ppg=(p,l)=>(p||65)/gpf(l||14);
const eur=n=>n.toFixed(2).replace(".",",")+"\u202f€";
const ptot=n=>(counts[n]||[]).reduce((a,b)=>a+b,0);
const dtot=di=>NAMES.reduce((s,n)=>s+(counts[n]?.[di]||0),0);
const gtot=()=>NAMES.reduce((s,n)=>s+ptot(n),0);
const getAva=n=>avatars[n.replace(/\s/g,"_")]||avatars[n]||n[0];
const getRank=n=>[...NAMES].sort((a,b)=>ptot(b)-ptot(a)).indexOf(n);
const getStreak=n=>{let s=0;for(let i=DAYS.length-1;i>=0;i--){if((counts[n]||[])[i]>0)s++;else break;}return s;};
const getBadges=n=>{const t=ptot(n),rank=getRank(n),streak=getStreak(n);return BADGE_DEFS.filter(b=>b.check(t,rank,streak));};
const getDayRecord=()=>{if(TIDX<0)return null;let max=0,who="";NAMES.forEach(n=>{const v=(counts[n]||[])[TIDX]||0;if(v>max){max=v;who=n;}});return max>0?{who,val:max}:null;};
const fmtTime=ts=>{if(!ts)return"";const d=new Date(ts);return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});};
const teamScore=t=>t.members.reduce((s,n)=>s+ptot(n),0);
const isSoiree=()=>{const h=new Date().getHours();return h>=18||h<4;};
const getSoireeStart=()=>{const now=new Date();if(now.getHours()<4)now.setDate(now.getDate()-1);now.setHours(18,0,0,0);return now.getTime();};
const getSoireeDuration=()=>{if(!isSoiree())return null;const diff=Date.now()-getSoireeStart();const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000);return`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;};
const getSoireeVerres=()=>{if(TIDX<0)return 0;return dtot(TIDX);};
const getPrediction=()=>{const gt=gtot(),total=gpf(cfg.l1);if(gt===0)return null;const daysElapsed=Math.max(1,DAYS.slice(0,TIDX>=0?TIDX+1:DAYS.length).length);const avgPerDay=gt/daysElapsed;const remaining=total-gt;if(remaining<=0)return"Le fût est épuisé 🎉";const daysLeft=remaining/avgPerDay;return`Fût vide dans ~${daysLeft.toFixed(1)} jour${daysLeft>1?"s":""}`;};

async function saveC(c){try{await set(CREF,JSON.parse(JSON.stringify(c)));}catch(e){}}
async function saveCFG(c){try{await set(CFGREF,JSON.parse(JSON.stringify(c)));}catch(e){}}
async function sendChat(text){if(!text.trim()||!user)return;try{await push(CHATREF,{user,ava:getAva(user),text:text.trim(),ts:Date.now()});}catch(e){}}
async function saveReact(dayKey,emoji){try{const r={...(reactions[dayKey]||{})};r[emoji]=(r[emoji]||0)+1;await set(ref(db,`bieres/reactions/${dayKey}`),r);}catch(e){}}
async function saveAva(n,emoji){try{await set(ref(db,`bieres/avatars/${n.replace(/\s/g,"_")}`),emoji);avatars[n.replace(/\s/g,"_")]=emoji;}catch(e){}}
async function saveAnnonce(txt){try{await set(ANNREF,txt?{text:txt,ts:Date.now()}:null);}catch(e){}}

onValue(CREF,s=>{const d=s.val();if(d)NAMES.forEach(n=>{if(Array.isArray(d[n]))counts[n]=d[n];});document.getElementById("loader").style.display="none";document.getElementById("app").style.display="block";render();});
onValue(CFGREF,s=>{const d=s.val();if(d)cfg={...cfg,...d};if(screen!=="login")render();});
onValue(AVREF,s=>{const d=s.val();if(d)Object.keys(d).forEach(k=>{avatars[k]=d[k];});if(screen!=="login")render();});
onValue(ANNREF,s=>{annonce=s.val()||null;if(screen!=="login")render();});
onValue(CHATREF,s=>{
  const d=s.val();
  chatMsgs=d?Object.values(d).sort((a,b)=>a.ts-b.ts):[];
  if(subScreen!=="chat"&&chatMsgs.length>0&&chatMsgs[chatMsgs.length-1].ts>lastChatSeen)
    unreadChat=chatMsgs.filter(m=>m.ts>lastChatSeen&&m.user!==user).length;
  if(screen!=="login")render();
});
onValue(REACTREF,s=>{reactions=s.val()||{};if(screen!=="login")render();});

// ── SOUND ──
function playBeerSound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const buf=ctx.createBuffer(1,ctx.sampleRate*.3,ctx.sampleRate);const data=buf.getChannelData(0);for(let i=0;i<data.length;i++){data[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*.08))*0.3;}const src=ctx.createBufferSource();src.buffer=buf;const gain=ctx.createGain();gain.gain.setValueAtTime(.8,0);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);src.connect(gain);gain.connect(ctx.destination);src.start();}catch(e){}}

// ── CONFETTIS ──
function showConfetti(){const c=document.getElementById("confetti-container");c.innerHTML="";const colors=["#F2A91E","#D4860A","#81c784","#64b5f6","#ce93d8","#ef9a9a"];for(let i=0;i<60;i++){const p=document.createElement("div");p.className="confetti-piece";p.style.cssText=`left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*6}px;height:${6+Math.random()*6}px;border-radius:${Math.random()>.5?"50%":"2px"};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.5}s;`;c.appendChild(p);}setTimeout(()=>c.innerHTML="",4000);}

// ── NOTIF ──
function notif(msg,col="#81c784"){const e=document.getElementById("notif");e.textContent=msg;e.style.background=col;e.style.display="block";e.style.opacity="1";clearTimeout(window._nt);window._nt=setTimeout(()=>{e.style.opacity="0";setTimeout(()=>e.style.display="none",300);},2000);}

// ── THEME ──
function toggleTheme(){lightMode=!lightMode;document.body.classList.toggle("light-mode",lightMode);}

// ── ROULETTE ──
function showRoulette(){
  const drinkers=NAMES.filter(n=>ptot(n)>0);
  if(drinkers.length===0){notif("Personne n'a bu encore !","#ef9a9a");return;}
  const winner=drinkers[Math.floor(Math.random()*drinkers.length)];
  const modal=document.createElement("div");
  modal.className="roulette-modal";
  modal.innerHTML=`<div class="roulette-card">
    <div style="font-family:'Bebas Neue',cursive;font-size:14px;letter-spacing:3px;color:var(--amber);margin-bottom:16px;">🎰 QUI PAIE LA TOURNÉE ?</div>
    <span class="roulette-wheel">${getAva(winner)}</span>
    <div class="roulette-winner">${winner.toUpperCase()}</div>
    <div class="roulette-sub">paie la prochaine tournée ! 🍺</div>
    <button style="margin-top:20px;background:rgba(242,169,30,0.15);border:1px solid rgba(242,169,30,0.3);border-radius:12px;color:var(--gold);font-family:'Bebas Neue',cursive;font-size:16px;letter-spacing:2px;padding:10px 24px;" id="close-roulette">FERMER</button>
  </div>`;
  document.body.appendChild(modal);
  document.getElementById("close-roulette").addEventListener("click",()=>modal.remove());
  modal.addEventListener("click",e=>{if(e.target===modal)modal.remove();});
}

// ── RENDER ──
function render(){
  const app=document.getElementById("app");
  if(screen==="login"){app.innerHTML=rLogin();bLogin();return;}
  if(screen==="avatar"){app.innerHTML=rAvatarPicker();bAvatarPicker();return;}

  const chatBadge=unreadChat>0?`<span class="bnav-badge">${unreadChat}</span>`:"";
  const nav=`<div class="bnav">
    <button class="bnav-btn${subScreen==="home"?" active":""}" id="nav-home"><span class="bnav-ico">🏠</span><span class="bnav-lbl">Accueil</span></button>
    <button class="bnav-btn${subScreen==="saisie"?" active":""}" id="nav-saisie"><span class="bnav-ico">✏️</span><span class="bnav-lbl">Saisie</span></button>
    <button class="bnav-btn${subScreen==="recap"?" active":""}" id="nav-recap"><span class="bnav-ico">📊</span><span class="bnav-lbl">Stats</span></button>
    <button class="bnav-btn${subScreen==="chat"?" active":""}" id="nav-chat" style="position:relative;"><span class="bnav-ico">💬</span><span class="bnav-lbl">Tchat</span>${chatBadge}</button>
    ${isAdmin?`<button class="bnav-btn${subScreen==="admin"?" active":""}" id="nav-admin"><span class="bnav-ico">👑</span><span class="bnav-lbl">Admin</span></button>`:""}
  </div>`;

  let content="";
  if(subScreen==="home")content=rHome();
  else if(subScreen==="saisie")content=rSaisie();
  else if(subScreen==="recap")content=rRecap();
  else if(subScreen==="chat")content=rChat();
  else if(subScreen==="admin"&&isAdmin)content=rAdmin();

  app.innerHTML=content+nav;
  if(subScreen==="home")bHome();
  else if(subScreen==="saisie")bSaisie();
  else if(subScreen==="chat")bChat();
  else if(subScreen==="admin"&&isAdmin)bAdmin();
  bindNav();

  // Update soiree chrono every minute
  if(subScreen==="home"&&isSoiree()){
    clearInterval(window._chronoInterval);
    window._chronoInterval=setInterval(()=>{
      const el=document.getElementById("soiree-chrono");
      if(el)el.textContent=getSoireeDuration();
      else clearInterval(window._chronoInterval);
    },10000);
  }
}

function bindNav(){
  document.getElementById("nav-home").onclick=()=>{subScreen="home";render();};
  document.getElementById("nav-saisie").onclick=()=>{subScreen="saisie";render();};
  document.getElementById("nav-recap").onclick=()=>{subScreen="recap";render();};
  document.getElementById("nav-chat").onclick=()=>{subScreen="chat";unreadChat=0;lastChatSeen=Date.now();render();};
  if(isAdmin)document.getElementById("nav-admin").onclick=()=>{subScreen="admin";render();};
}

// ══ LOGIN ══
function rLogin(){
  const nbtn=NAMES.map(n=>{const t=ptot(n),ava=getAva(n);return`<button class="name-btn" data-n="${n}"><div class="nava">${ava}</div><span class="ntxt">${n}</span>${t>0?`<span class="ncount">${t}🍺</span>`:""}</button>`;}).join("");
  return`<div class="page">
  <div class="hero">
    <div class="orn">✦ &nbsp; ✦ &nbsp; ✦</div>
    <svg width="210" height="16" viewBox="0 0 240 20" style="display:block;margin:0 auto 12px;opacity:.45;"><line x1="0" y1="10" x2="88" y2="10" stroke="#D4860A" stroke-width=".8"/><circle cx="99" cy="10" r="3" fill="#D4860A"/><circle cx="111" cy="5" r="2" fill="#F2A91E"/><circle cx="120" cy="10" r="4" fill="#F2A91E"/><circle cx="129" cy="5" r="2" fill="#F2A91E"/><circle cx="141" cy="10" r="3" fill="#D4860A"/><line x1="152" y1="10" x2="240" y2="10" stroke="#D4860A" stroke-width=".8"/></svg>
    <div class="logo-row">
      <div class="beer-wrap"><div class="bstream"></div><div class="bglass"><div class="bliq"><div class="bub"></div><div class="bub"></div><div class="bub"></div></div><div class="bfoam"></div></div></div>
      <div><div class="ss">S<span class="ss-amp">&amp;</span>S</div><div class="ss-mar">Mariage</div></div>
    </div>
    <div class="hdiv"><div class="hdivl"></div><div class="hdivm"></div><div class="hdivl"></div></div>
    <div class="htitle">BIÈRE</div>
    <div class="hlove">✦ &nbsp; Love Edition &nbsp; ✦</div>
    ${cfg.n1?`<div class="hmodel">🍺 ${cfg.n1}</div>`:""}
    <div class="orn" style="margin-top:12px;">✦ &nbsp; ✦ &nbsp; ✦</div>
  </div>
  <div class="sub">Mar 23 — Mar 30</div>
  <div class="fut-info">
    <div class="fut-badge">🍺 Fût 1 · ${cfg.l1}L · ${cfg.p1}€ · ${gpf(cfg.l1)}v · ${eur(ppg(cfg.p1,cfg.l1))}/v${cfg.n1?" — "+cfg.n1:""}</div>
    ${cfg.f2?`<div class="fut-badge2">🍺 Fût 2 · ${cfg.l2}L · ${cfg.p2}€ · ${gpf(cfg.l2)}v · ${eur(ppg(cfg.p2,cfg.l2))}/v${cfg.n2?" — "+cfg.n2:""}</div>`:""}
  </div>
  <div class="slbl">👤 QUI ES-TU ?</div>
  <div class="name-grid">${nbtn}</div>
  <button id="btn-al" class="admin-lnk">🔐 Admin</button>
  <div id="pin-panel" style="display:none;">
    <div class="pin-wrap">
      <div class="pin-title">CODE ADMIN</div>
      <div class="pin-dots">${[0,1,2,3].map(()=>`<div class="pin-dot"></div>`).join("")}</div>
      <div id="pin-err" style="display:none;color:var(--red);font-size:12px;font-weight:800;letter-spacing:1px;text-align:center;margin-bottom:6px;">✗ Code incorrect</div>
      <div class="pin-grid">${[1,2,3,4,5,6,7,8,9,null,"0","⌫"].map(d=>d===null?`<div></div>`:`<button class="pin-btn" data-d="${d}">${d}</button>`).join("")}</div>
      <button id="pin-bk" class="pin-back">← Retour</button>
    </div>
  </div>
</div>`;
}

function bLogin(){
  let pin="";
  document.querySelectorAll(".name-btn").forEach(b=>b.addEventListener("click",()=>{
    user=b.dataset.n;isAdmin=false;screen="avatar";render();
  }));
  document.getElementById("btn-al").onclick=()=>{document.getElementById("btn-al").style.display="none";document.getElementById("pin-panel").style.display="block";};
  document.getElementById("pin-bk").onclick=()=>{pin="";upDots(pin,false);document.getElementById("btn-al").style.display="block";document.getElementById("pin-panel").style.display="none";document.getElementById("pin-err").style.display="none";};
  document.querySelectorAll(".pin-btn").forEach(b=>b.addEventListener("click",()=>{
    const d=b.dataset.d;
    if(d==="⌫"){pin=pin.slice(0,-1);upDots(pin,false);document.getElementById("pin-err").style.display="none";return;}
    if(pin.length>=4)return;
    pin+=d;upDots(pin,false);
    if(pin.length===4){
      if(pin===ADMIN){isAdmin=true;user="Seb";screen="main";subScreen="home";render();}
      else{upDots(pin,true);document.getElementById("pin-err").style.display="block";setTimeout(()=>{pin="";upDots(pin,false);document.getElementById("pin-err").style.display="none";},700);}
    }
  }));
}

function bSaisie(){
  document.querySelectorAll(".bminus,.bplus").forEach(b=>b.addEventListener("click",async()=>{

    if(d>0){
      playBeerSound();

      const newBadges=getBadges(n);
      if(newBadges.length>prev){const nb=newBadges[newBadges.length-1];setTimeout(()=>{notif(`${nb.icon} Badge débloqué : ${nb.label} !`,"#ce93d8");showConfetti();},600);}

  document.getElementById("p1").oninput=uc1;document.getElementById("l1").oninput=uc1;
  document.getElementById("f2chk").onchange=function(){document.getElementById("f2fields").style.display=this.checked?"block":"none";};
  const uc2=()=>{const p=parseFloat(document.getElementById("p2").value)||65,l=parseFloat(document.getElementById("l2").value)||14,g=gpf(l);document.getElementById("ci2").innerHTML=`${g} verres · <strong style="color:var(--blue)">${eur(p/g)}</strong>/verre`;};
  document.getElementById("p2").oninput=uc2;document.getElementById("l2").oninput=uc2;
  document.getElementById("btn-sv").onclick=async()=>{
    cfg={p1:parseFloat(document.getElementById("p1").value)||65,l1:parseFloat(document.getElementById("l1").value)||14,n1:document.getElementById("n1").value.trim(),f2:document.getElementById("f2chk").checked,p2:parseFloat(document.getElementById("p2").value)||65,l2:parseFloat(document.getElementById("l2").value)||14,n2:document.getElementById("n2").value.trim()};
    await saveCFG(cfg);notif("Sauvegardé ✓");
  };
  document.querySelectorAll(".ap-row").forEach(r=>r.onclick=()=>{
    const k=r.dataset.p.replace(/\s/g,"_"),g=document.getElementById(`ag-${k}`),c=document.getElementById(`ac-${k}`),o=g.style.display!=="none";
    document.querySelectorAll(".ad-grid").forEach(x=>x.style.display="none");document.querySelectorAll(".ap-chev").forEach(x=>x.textContent="▼");
    if(!o){g.style.display="grid";c.textContent="▲";}
  });
  document.querySelectorAll(".adm,.adp").forEach(b=>b.addEventListener("click",async e=>{
    e.stopPropagation();
    const n=b.dataset.n,di=parseInt(b.dataset.i),d=b.classList.contains("adp")?1:-1;
    counts[n]=counts[n]||new Array(DAYS.length).fill(0);
    counts[n][di]=Math.max(0,(counts[n][di]||0)+d);
    await saveC(counts);
    const k=n.replace(/\s/g,"_"),ev=document.getElementById(`av-${k}-${di}`);
    if(ev){ev.textContent=counts[n][di];ev.className="ad-val"+(counts[n][di]>0?" ad-on":"");}
    const tot=(counts[n]||[]).reduce((a,b)=>a+b,0);
    const te=document.getElementById(`at-${k}`);if(te)te.textContent=`${tot}🍺`;
    notif(d>0?`+1 (${n})`:`−1 (${n})`,d>0?"#81c784":"#ef9a9a");
  }));
  document.getElementById("btn-rst").onclick=async()=>{if(!confirm("Réinitialiser TOUS les compteurs ?"))return;counts=init();await saveC(counts);notif("Réinitialisé ✓","#ef9a9a");render();};
}

// PDF Export
window.addEventListener("click",e=>{if(e.target.id==="btn-pdf")window.print();});
window.toggleTheme=toggleTheme;
</script>
</body>
