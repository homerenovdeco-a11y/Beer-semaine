<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bières 🍺">
<meta name="theme-color" content="#0C0803">
<title>Bières 🍺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,400;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #F2A91E;
  --amber: #D4860A;
  --dark: #0C0803;
  --dark2: #1A1208;
  --mid: #6B4C2A;
  --cream: #FFF8E7;
  --green: #81c784;
  --red: #ef9a9a;
  --border: rgba(212,134,10,0.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{background:var(--dark);font-family:'Nunito',sans-serif;color:var(--cream);max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;}
button{cursor:pointer;font-family:'Nunito',sans-serif;outline:none;}
input{font-family:'Nunito',sans-serif;outline:none;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(242,169,30,0.2);border-radius:2px;}

/* NOTIFICATION */
#notif{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:9px 22px;border-radius:30px;font-weight:800;font-size:14px;z-index:9999;color:#1A1208;letter-spacing:1px;box-shadow:0 4px 20px rgba(0,0,0,0.5);white-space:nowrap;pointer-events:none;display:none;transition:opacity 0.3s;}

/* LOADER */
#loader{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8888;}
#loader .beer{font-size:60px;animation:pulse 1s ease-in-out infinite;}
#loader p{font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:4px;color:var(--amber);margin-top:12px;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}</style>
</head>
<body>

<div id="notif"></div>
<div id="loader"><div class="beer">🍺</div><p>Connexion...</p></div>
<div id="app" style="display:none;"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── CONFIG FIREBASE ──────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBdmzcmnUd4nTRS53m40ArT6WnLvgSdyew",
  authDomain: "beer-conso.firebaseapp.com",
  projectId: "beer-conso",
  storageBucket: "beer-conso.firebasestorage.app",
  messagingSenderId: "247215118379",
  appId: "1:247215118379:web:98c025e40ca9c4392db26e",
  // ⬇️ REMPLACE PAR TON URL REALTIME DATABASE
  databaseURL: "https://beer-conso-default-rtdb.europe-west1.firebasedatabase.app"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

// ── APP CONFIG ───────────────────────────────────
const ADMIN_PIN = "1414";
const NAMES = [
  "Seb","Solène","Éliane","Joël","Marie Claude","Alain",
  "Marion","Ludo","Matt","Laura","David","Fabien",
  "Sophie","Diego","Sophie D","Pauline","Xavier","Rico",
  "Mag","Stephan","Laura D","Kiki","Wojtek"
];
const DAYS = [
  {s:"Mar 23",f:"Mardi 23"},{s:"Mer 24",f:"Mercredi 24"},
  {s:"Jeu 25",f:"Jeudi 25"},{s:"Ven 26",f:"Vendredi 26"},
  {s:"Lun 29",f:"Lundi 29"},{s:"Mar 30",f:"Mardi 30"}
];
const FUT_PRICE = 65, FUT_LITERS = 14, GLASS_CL = 25;
const GLASSES_PER_FUT = Math.round((FUT_LITERS*100)/GLASS_CL);
const PRICE_REAL = FUT_PRICE / GLASSES_PER_FUT;
const TODAY_IDX = (() => { const d=new Date().getDate(); const m={23:0,24:1,25:2,26:3,29:4,30:5}; return d in m ? m[d] : -1; })();

// ── STATE ────────────────────────────────────────
let counts = {};
let isAdmin = false;
let currentUser = null;
let screen = "login";

const initCounts = () => { const o={}; NAMES.forEach(n=>{o[n]=new Array(DAYS.length).fill(0);}); return o; };
counts = initCounts();

// ── FIREBASE REALTIME ────────────────────────────
const dbRef = ref(db, "bieres/counts");

onValue(dbRef, snap => {
  const data = snap.val();
  if (data) {
    NAMES.forEach(n => { if (Array.isArray(data[n])) counts[n] = data[n]; });
  }
  document.getElementById("loader").style.display = "none";
  document.getElementById("app").style.display = "block";
  render();
});

async function saveCount(name, di, val) {
  counts[name] = [...(counts[name] || new Array(DAYS.length).fill(0))];
  counts[name][di] = Math.max(0, val);
  try { await set(dbRef, JSON.parse(JSON.stringify(counts))); } catch(e) { console.error(e); }
}

async function saveAllCounts(newCounts) {
  try { await set(dbRef, JSON.parse(JSON.stringify(newCounts))); } catch(e) { console.error(e); }
}

// ── HELPERS ──────────────────────────────────────
const fmtEur = n => n.toFixed(2).replace(".",",")+"\u202f€";
const personTotal = n => (counts[n]||[]).reduce((a,b)=>a+b,0);
const dayTotal = di => NAMES.reduce((s,n)=>s+(counts[n]?.[di]||0),0);
const grandTotal = () => NAMES.reduce((s,n)=>s+personTotal(n),0);

function notify(msg, color="#81c784") {
  const el = document.getElementById("notif");
  el.textContent = msg;
  el.style.background = color;
  el.style.display = "block";
  el.style.opacity = "1";
  clearTimeout(window._nt);
  window._nt = setTimeout(()=>{ el.style.opacity="0"; setTimeout(()=>el.style.display="none",300); }, 1800);
}

// ── RENDER ───────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  if (screen === "login")  { app.innerHTML = renderLogin(); bindLogin(); }
  if (screen === "home")   { app.innerHTML = renderHome();  bindHome();  }
  if (screen === "saisie") { app.innerHTML = renderSaisie(); bindSaisie(); }
  if (screen === "recap")  { app.innerHTML = renderRecap(); bindRecap(); }
  if (screen === "admin")  { app.innerHTML = renderAdmin(); bindAdmin(); }
}

// ════════════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════════════
function renderLogin() {
  const nameButtons = NAMES.map(name => {
    const t = personTotal(name);
    return `<button class="name-btn" data-name="${name}">
      <div class="name-ava">${name[0]}</div>
      <span class="name-txt">${name}</span>
      ${t>0?`<span class="name-count">${t}🍺</span>`:""}
    </button>`;
  }).join("");

  return `
  <div class="page">
    <div class="login-hero">
      <div class="hero-card">
        <div class="hero-ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
        <svg width="240" height="20" viewBox="0 0 240 20" style="display:block;margin:0 auto 16px;opacity:0.55;">
          <line x1="0" y1="10" x2="90" y2="10" stroke="#D4860A" stroke-width="0.8" opacity="0.5"/>
          <circle cx="100" cy="10" r="3" fill="#D4860A" opacity="0.5"/>
          <circle cx="112" cy="5" r="2" fill="#F2A91E" opacity="0.6"/>
          <circle cx="120" cy="10" r="4" fill="#F2A91E" opacity="0.7"/>
          <circle cx="128" cy="5" r="2" fill="#F2A91E" opacity="0.6"/>
          <circle cx="140" cy="10" r="3" fill="#D4860A" opacity="0.5"/>
          <line x1="150" y1="10" x2="240" y2="10" stroke="#D4860A" stroke-width="0.8" opacity="0.5"/>
        </svg>
        <div class="logo-row">
          <div class="beer-wrap">
            <div class="stream"></div>
            <div class="glass">
              <div class="liquid">
                <div class="bubble"></div>
                <div class="bubble"></div>
                <div class="bubble"></div>
              </div>
              <div class="foam"></div>
            </div>
          </div>
          <div class="ss-block">
            <div class="ss-letters">S<span class="ss-amp">&amp;</span>S</div>
            <div class="ss-mariage">Mariage</div>
          </div>
        </div>
        <div class="hero-divider">
          <div class="divider-line"></div>
          <div class="divider-diamond"></div>
          <div class="divider-line"></div>
        </div>
        <div class="title-biere">BIÈRE</div>
        <div class="love-edition">✦ &nbsp; Love Edition &nbsp; ✦</div>
        <div class="hero-ornament" style="margin-top:16px;">✦ &nbsp; ✦ &nbsp; ✦</div>
      </div>
      <div class="login-sub" style="margin-top:12px;">Mar 23 — Mar 30</div>
      <div class="fut-pill">Fût ${FUT_LITERS}L · ${FUT_PRICE}€ TTC · ${GLASSES_PER_FUT} verres · ${fmtEur(PRICE_REAL)}/verre</div>
    </div>
    <div class="section-lbl">👤 QUI ES-TU ?</div>
    <div class="name-grid">${nameButtons}</div>
    <button id="btn-admin-link" class="admin-link">🔐 Admin</button>
    <div id="pin-panel" style="display:none;">
      <div class="pin-wrap">
        <div class="pin-title">CODE ADMIN</div>
        <div class="pin-dots" id="pin-dots">
          <div class="pin-dot"></div><div class="pin-dot"></div>
          <div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <div id="pin-err" style="display:none;color:var(--red);font-size:12px;font-weight:800;letter-spacing:1px;margin-bottom:6px;text-align:center;">✗ Code incorrect</div>
        <div class="pin-grid">
          ${[1,2,3,4,5,6,7,8,9,null,"0","⌫"].map(d=>
            d===null ? `<div></div>` :
            `<button class="pin-btn" data-d="${d}">${d}</button>`
          ).join("")}
        </div>
        <button id="pin-back" class="back-txt">← Retour</button>
      </div>
    </div>
  </div>`;
}

function bindLogin() {
  let pin = "";
  document.querySelectorAll(".name-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentUser = btn.dataset.name;
      isAdmin = false;
      screen = "home";
      render();
    });
  });
  document.getElementById("btn-admin-link").addEventListener("click", () => {
    document.getElementById("btn-admin-link").style.display = "none";
    document.getElementById("pin-panel").style.display = "block";
  });
  document.getElementById("pin-back").addEventListener("click", () => {
    pin = "";
    document.getElementById("btn-admin-link").style.display = "block";
    document.getElementById("pin-panel").style.display = "none";
    updatePinDots(pin, false);
    document.getElementById("pin-err").style.display = "none";
  });
  document.querySelectorAll(".pin-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const d = btn.dataset.d;
      if (d === "⌫") { pin = pin.slice(0,-1); updatePinDots(pin,false); document.getElementById("pin-err").style.display="none"; return; }
      if (pin.length >= 4) return;
      pin += d;
      updatePinDots(pin, false);
      if (pin.length === 4) {
        if (pin === ADMIN_PIN) {
          isAdmin = true; currentUser = "Seb"; screen = "home"; render();
        } else {
          updatePinDots(pin, true);
          document.getElementById("pin-err").style.display = "block";
          setTimeout(() => { pin = ""; updatePinDots(pin, false); document.getElementById("pin-err").style.display="none"; }, 700);
        }
      }
    });
  });
}

function updatePinDots(pin, err) {
  document.querySelectorAll(".pin-dot").forEach((dot, i) => {
    dot.style.background = pin.length > i ? "var(--gold)" : "rgba(255,255,255,0.1)";
    dot.style.boxShadow = pin.length > i ? "0 0 12px rgba(242,169,30,0.5)" : "none";
    dot.style.borderColor = err ? "rgba(239,154,154,0.6)" : "rgba(242,169,30,0.3)";
  });
}

// ════════════════════════════════════════════════
// HOME
// ════════════════════════════════════════════════
function renderHome() {
  const gt = grandTotal();
  const collected = gt;
  const futCost = gt * PRICE_REAL;
  const balance = collected - futCost;
  const myTot = personTotal(currentUser);

  return `
  <div class="page">
    <div class="header">
      <button id="btn-quit" class="quit-btn">← Quitter</button>
      <div class="header-name">${isAdmin ? "👑 ADMIN — SEB" : currentUser.toUpperCase()}</div>
      <div class="sync-dot" id="sync-dot"></div>
    </div>
    <div class="my-card">
      <div class="my-card-lbl">MES VERRES · SEMAINE</div>
      <div class="my-big">${myTot}</div>
      <div class="my-due">Je dois <strong style="color:var(--green)">${myTot},00\u202f€</strong></div>
      <div class="my-real">Coût réel\u202f: ${fmtEur(myTot * PRICE_REAL)}</div>
    </div>
    <div class="tri-cards">

      </div>
      <div class="tri-card" style="border-color:rgba(129,199,116,0.35)">

        <div class="tri-lbl">💰 Caisse</div>
      </div>
      <div class="tri-card" style="border-color:${balance>=0?"rgba(129,199,116,0.35)":"rgba(239,154,154,0.35)"}">
        <div style="font-family:'Bebas Neue',cursive;font-size:17px;color:${balance>=0?"var(--green)":"var(--red)"};letter-spacing:1px;">${(balance>=0?"+":"")+fmtEur(balance)}</div>
        <div class="tri-lbl">⚖️ Solde</div>
      </div>
    </div>
    <div class="act-col">
      <button class="act-btn" id="btn-saisie">
        <span style="font-size:22px;">✏️</span>
        <div style="flex:1;text-align:left;">
          <div style="font-size:14px;font-weight:800;color:var(--cream);">Saisir mes verres</div>

        </div>
      </button>
      ${isAdmin ? `<button class="act-btn act-gold" id="btn-admin">
        <span style="font-size:22px;">👑</span>
        <div style="flex:1;text-align:left;">
          <div style="font-size:14px;font-weight:800;color:var(--gold);">Administration</div>
          <div style="font-size:11px;color:var(--mid);margin-top:1px;">Modifier · Configurer · Réinitialiser</div>
        </div>
      </button>` : ""}
    </div>
    <div class="foot-sync">⟳ Synchronisation Firebase temps réel</div>
  </div>`;
}

function bindHome() {
  document.getElementById("btn-quit").addEventListener("click", () => { currentUser=null; isAdmin=false; screen="login"; render(); });
  document.getElementById("btn-saisie").addEventListener("click", () => { screen="saisie"; render(); });
  document.getElementById("btn-recap").addEventListener("click", () => { screen="recap"; render(); });
  if (isAdmin) document.getElementById("btn-admin").addEventListener("click", () => { screen="admin"; render(); });
}

// ════════════════════════════════════════════════
// SAISIE
// ════════════════════════════════════════════════
function renderSaisie() {
  const name = currentUser;
  const mc = counts[name] || new Array(DAYS.length).fill(0);
  const tot = mc.reduce((a,b)=>a+b,0);

  const rows = DAYS.map((day, di) => {
    const v = mc[di] || 0;
    const today = di === TODAY_IDX;
    return `<div class="day-row ${today?"day-today":""}" data-di="${di}">
      <div>
        <div class="day-name">${day.f}</div>
        ${today?`<div class="today-tag">AUJOURD'HUI</div>`:""}
      </div>
      <div class="counter">
        <button class="btn-minus" data-name="${name}" data-di="${di}">−</button>
        <span class="c-val ${v>0?"c-active":""}" id="val-${di}">${v}</span>
        <button class="btn-plus" data-name="${name}" data-di="${di}">+</button>
      </div>
    </div>`;
  }).join("");

  return `
  <div class="page">
    <div class="top-bar">
      <button class="back-btn" id="btn-back">← Retour</button>
      <div class="top-bar-txt">${name}</div>
      <div style="width:70px;"></div>
    </div>
    <div class="saisie-wrap">
      <div class="tot-banner">
        <span>Total semaine</span>
        <span id="tot-val" style="font-family:'Bebas Neue',cursive;font-size:22px;color:var(--gold);letter-spacing:1px;">${tot} 🍺 · ${tot},00\u202f€</span>
      </div>
      ${rows}
    </div>
  </div>`;
}

function bindSaisie() {
  document.getElementById("btn-back").addEventListener("click", () => { screen="home"; render(); });
  document.querySelectorAll(".btn-minus,.btn-plus").forEach(btn => {
    btn.addEventListener("click", async () => {
      const name = btn.dataset.name;
      const di = parseInt(btn.dataset.di);
      const delta = btn.classList.contains("btn-plus") ? 1 : -1;
      const cur = (counts[name]?.[di] || 0);
      const newVal = Math.max(0, cur + delta);
      await saveCount(name, di, newVal);
      // update UI inline without full re-render
      const valEl = document.getElementById(`val-${di}`);
      if (valEl) {
        valEl.textContent = counts[name][di];
        valEl.className = "c-val" + (counts[name][di]>0?" c-active":"");
      }
      // update banner
      const tot = (counts[name]||[]).reduce((a,b)=>a+b,0);
      const totEl = document.getElementById("tot-val");
      if (totEl) totEl.textContent = `${tot} 🍺 · ${tot},00\u202f€`;
      notify(delta>0?"+1 🍺":"−1 🍺", delta>0?"#81c784":"#ef9a9a");
    });
  });
}

// ════════════════════════════════════════════════
// RECAP
// ════════════════════════════════════════════════
function renderRecap() {
  const gt = grandTotal();
  const collected = gt;
  const futCost = gt * PRICE_REAL;
  const balance = collected - futCost;
  const sorted = [...NAMES].sort((a,b)=>personTotal(b)-personTotal(a));
  const maxV = Math.max(...NAMES.map(personTotal), 1);

  const dayRows = DAYS.map((day,di) => `
    <div class="ligne ${di===TODAY_IDX?"ligne-hi":""}">
      <span class="ligne-lbl">${day.f}</span>
      <span class="ligne-val ${di===TODAY_IDX?"ligne-val-hi":""}">${dayTotal(di)} 🍺</span>
    </div>`).join("");

  const rankRows = sorted.map((name,i) => {
    const t = personTotal(name);
    return `<div class="rank-row ${name===currentUser?"rank-me":""}">
      <span class="r-i">${i+1}</span>
      <span class="r-name">${name}</span>
      <div class="r-bar"><div class="r-fill" style="width:${(t/maxV)*100}%"></div></div>
      <span class="r-val" style="color:${t>0?"var(--gold)":"rgba(255,255,255,0.15)"}">${t}</span>
      <span class="r-eur">${t}€</span>
    </div>`;
  }).join("");

  return `
  <div class="page">
    <div class="top-bar">
      <button class="back-btn" id="btn-back">← Retour</button>
      <div class="top-bar-txt">TABLEAU COMPLET</div>
      <div style="width:70px;"></div>
    </div>
    <div class="scroll-wrap">
      <div class="bloc">
        <div class="bloc-title">🛢 BILAN FÛT</div>
        <div class="ligne ligne-hi"><span class="ligne-lbl">Fût</span><span class="ligne-val ligne-val-hi">${FUT_LITERS}L · ${FUT_PRICE}€ TTC</span></div>
        <div class="ligne"><span class="ligne-lbl">Verres estimés (~${GLASS_CL}cl)</span><span class="ligne-val">${GLASSES_PER_FUT} verres</span></div>
        <div class="ligne ligne-hi"><span class="ligne-lbl">Prix réel / verre</span><span class="ligne-val ligne-val-hi">${fmtEur(PRICE_REAL)}</span></div>
        <div class="ligne"><span class="ligne-lbl">Prix facturé / verre</span><span class="ligne-val">1,00\u202f€</span></div>
        <div class="ligne ligne-hi"><span class="ligne-lbl">Verres consommés</span><span class="ligne-val ligne-val-hi">${gt} 🍺</span></div>
        <div class="ligne"><span class="ligne-lbl">Collecté</span><span class="ligne-val">${fmtEur(collected)}</span></div>
        <div class="ligne"><span class="ligne-lbl">Coût fût réel</span><span class="ligne-val">${fmtEur(futCost)}</span></div>
        <div class="ligne ligne-hi"><span class="ligne-lbl">Solde</span><span class="ligne-val" style="color:${balance>=0?"var(--green)":"var(--red)"}">${(balance>=0?"+":"")+fmtEur(balance)}</span></div>
      </div>
      <div class="bloc">
        <div class="bloc-title">📅 PAR JOUR</div>
        ${dayRows}
      </div>
      <div class="bloc">
        <div class="bloc-title">🏆 CLASSEMENT</div>
        ${rankRows}
      </div>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════
// BIND RECAP
// ════════════════════════════════════════════════
function bindRecap() {
  document.getElementById("btn-back").addEventListener("click", () => { screen="home"; render(); });
}

// ════════════════════════════════════════════════
// ADMIN
// ════════════════════════════════════════════════
function renderAdmin() {
  const personCards = NAMES.map(name => {
    const mc = counts[name] || new Array(DAYS.length).fill(0);
    const tot = mc.reduce((a,b)=>a+b,0);
    const dayBoxes = DAYS.map((day,di) => {
      const v = mc[di]||0;
      return `<div class="ad-box ${di===TODAY_IDX?"ad-today":""}">
        <div class="ad-lbl">${day.s}</div>
        <div class="ad-val ${v>0?"ad-active":""}" id="adv-${name.replace(/\s/g,"_")}-${di}">${v}</div>
        <div class="ad-btns">
          <button class="ad-m" data-name="${name}" data-di="${di}">−</button>
          <button class="ad-p" data-name="${name}" data-di="${di}">+</button>
        </div>
      </div>`;
    }).join("");
    return `<div class="ap-wrap">
      <div class="ap-row" data-person="${name}">
        <div class="ap-ava">${name[0]}</div>
        <span class="ap-name">${name}</span>
        <span class="ap-tot" id="apt-${name.replace(/\s/g,"_")}">${tot}🍺 · ${tot}€</span>
        <span class="ap-chev" id="chev-${name.replace(/\s/g,"_")}">▼</span>
      </div>
      <div class="ad-grid" id="grid-${name.replace(/\s/g,"_")}" style="display:none;">${dayBoxes}</div>
    </div>`;
  }).join("");

  return `
  <div class="page">
    <div class="top-bar">
      <button class="back-btn" id="btn-back">← Retour</button>
      <div class="top-bar-txt">👑 ADMIN</div>
      <div style="width:70px;"></div>
    </div>
    <div class="scroll-wrap">
      <div class="admin-badge">Mode administrateur · Accès complet</div>
      <div class="bloc">
        <div class="bloc-title">✏️ MODIFIER LES COMPTEURS</div>
        ${personCards}
      </div>
      <div class="bloc">
        <div class="bloc-title">🛢 CONFIG (fixe)</div>
        <div class="ligne ligne-hi"><span class="ligne-lbl">Fût</span><span class="ligne-val ligne-val-hi">${FUT_LITERS}L · ${FUT_PRICE}€ TTC</span></div>
        <div class="ligne"><span class="ligne-lbl">Verres estimés</span><span class="ligne-val">${GLASSES_PER_FUT}</span></div>
        <div class="ligne ligne-hi"><span class="ligne-lbl">Prix réel/verre</span><span class="ligne-val ligne-val-hi">${fmtEur(PRICE_REAL)}</span></div>
        <div class="ligne"><span class="ligne-lbl">Période</span><span class="ligne-val">Mar 23 → Mar 30</span></div>
      </div>
      <div class="bloc">
        <div class="bloc-title">⚠️ DANGER</div>
        <button id="btn-reset" class="reset-btn">🔄 Réinitialiser toute la semaine</button>
      </div>
    </div>
  </div>`;
}

function bindAdmin() {
  document.getElementById("btn-back").addEventListener("click", () => { screen="home"; render(); });

  // Accordion
  document.querySelectorAll(".ap-row").forEach(row => {
    row.addEventListener("click", () => {
      const name = row.dataset.person;
      const key = name.replace(/\s/g,"_");
      const grid = document.getElementById(`grid-${key}`);
      const chev = document.getElementById(`chev-${key}`);
      const open = grid.style.display !== "none";
      document.querySelectorAll(".ad-grid").forEach(g=>g.style.display="none");
      document.querySelectorAll(".ap-chev").forEach(c=>c.textContent="▼");
      if (!open) { grid.style.display="grid"; chev.textContent="▲"; }
    });
  });

  // +/- buttons
  document.querySelectorAll(".ad-m,.ad-p").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const name = btn.dataset.name;
      const di = parseInt(btn.dataset.di);
      const delta = btn.classList.contains("ad-p") ? 1 : -1;
      const newVal = Math.max(0, (counts[name]?.[di]||0) + delta);
      await saveCount(name, di, newVal);
      const key = name.replace(/\s/g,"_");
      const valEl = document.getElementById(`adv-${key}-${di}`);
      if (valEl) { valEl.textContent = counts[name][di]; valEl.className = "ad-val"+(counts[name][di]>0?" ad-active":""); }
      const tot = (counts[name]||[]).reduce((a,b)=>a+b,0);
      const totEl = document.getElementById(`apt-${key}`);
      if (totEl) totEl.textContent = `${tot}🍺 · ${tot}€`;
      notify(delta>0?`+1 🍺 (${name})`:`−1 🍺 (${name})`, delta>0?"#81c784":"#ef9a9a");
    });
  });

  document.getElementById("btn-reset").addEventListener("click", async () => {
    if (!confirm("Réinitialiser TOUS les compteurs pour tout le monde ?")) return;
    counts = initCounts();
    await saveAllCounts(counts);
    notify("Réinitialisé ✓", "#ef9a9a");
    render();
  });
}
