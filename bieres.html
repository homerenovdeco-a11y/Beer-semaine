<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bières 🍺">
<meta name="theme-color" content="#0C0803">
<title>Bières 🍺</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,400;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{--gold:#F2A91E;--amber:#D4860A;--dark:#0C0803;--dark2:#1A1208;--mid:#6B4C2A;--cream:#FFF8E7;--green:#81c784;--red:#ef9a9a;--border:rgba(212,134,10,0.18);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{background:var(--dark);font-family:'Nunito',sans-serif;color:var(--cream);max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;}
button{cursor:pointer;font-family:'Nunito',sans-serif;outline:none;}
input,textarea{font-family:'Nunito',sans-serif;outline:none;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(242,169,30,0.2);border-radius:2px;}

#notif{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:9px 22px;border-radius:30px;font-weight:800;font-size:14px;z-index:9999;color:#1A1208;letter-spacing:1px;box-shadow:0 4px 20px rgba(0,0,0,0.5);white-space:nowrap;pointer-events:none;display:none;transition:opacity 0.3s;}
#loader{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8888;}
#loader .beer{font-size:60px;animation:pulse 1s ease-in-out infinite;}
#loader p{font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:4px;color:var(--amber);margin-top:12px;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

/* HERO */
.hero-card{margin:0 14px;background:linear-gradient(160deg,#1A1208,#0C0803);border:1px solid rgba(212,134,10,0.3);border-radius:24px;padding:28px 20px 22px;text-align:center;box-shadow:0 0 40px rgba(212,134,10,0.06),inset 0 1px 0 rgba(255,255,255,0.04);}
.hero-ornament{font-family:'Bebas Neue',cursive;font-size:11px;color:rgba(212,134,10,0.45);letter-spacing:3px;margin-bottom:14px;}
.logo-row{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-bottom:14px;}
.beer-wrap{position:relative;width:44px;height:80px;flex-shrink:0;}
.stream{position:absolute;top:0;left:50%;transform:translateX(-50%);width:6px;background:linear-gradient(180deg,#F2A91E,rgba(212,134,10,0.5));border-radius:3px;height:0;animation:stream 3.2s ease-in-out infinite;z-index:3;}
.glass{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:36px;height:56px;border:2.5px solid rgba(242,169,30,0.75);border-top:none;border-radius:0 0 10px 10px;overflow:hidden;background:rgba(255,255,255,0.03);}
.glass::after{content:"";position:absolute;right:-10px;top:8px;width:10px;height:20px;border:2px solid rgba(242,169,30,0.6);border-left:none;border-radius:0 8px 8px 0;}
.liquid{position:absolute;bottom:0;left:0;right:0;height:0;background:linear-gradient(180deg,rgba(242,169,30,0.95),rgba(160,80,0,0.9));animation:fill 3.2s ease-in-out infinite;}
.bubble{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,220,100,0.7);animation:bubble 3.2s ease-in-out infinite;}
.bubble:nth-child(2){left:8px;animation-delay:0.3s;width:2px;height:2px;}
.bubble:nth-child(3){left:18px;animation-delay:0.6s;}
.foam{position:absolute;top:0;left:-2px;right:-2px;height:12px;background:rgba(255,255,255,0.88);border-radius:6px 6px 0 0;opacity:0;animation:foam 3.2s ease-in-out infinite;}
.ss-block{text-align:center;}
.ss-letters{font-family:'Playfair Display','Georgia',serif;font-size:72px;color:#F2A91E;line-height:1;font-style:italic;font-weight:700;text-shadow:0 0 30px rgba(242,169,30,0.35),0 2px 6px rgba(0,0,0,0.6);letter-spacing:-2px;}
.ss-amp{font-size:40px;color:#D4860A;vertical-align:middle;margin:0 3px;font-weight:400;}
.ss-mariage{font-size:10px;letter-spacing:7px;color:rgba(212,134,10,0.7);text-transform:uppercase;font-style:normal;font-weight:400;margin-top:3px;font-family:'Georgia',serif;}
.hero-divider{display:flex;align-items:center;gap:12px;margin:12px 0;}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(212,134,10,0.35),transparent);}
.divider-diamond{width:5px;height:5px;background:#D4860A;transform:rotate(45deg);opacity:0.6;flex-shrink:0;}
.title-biere{font-family:'Bebas Neue',cursive;font-size:52px;letter-spacing:12px;color:#F2A91E;line-height:1;text-shadow:0 0 30px rgba(242,169,30,0.3);text-indent:12px;}
.love-edition{font-family:'Georgia',serif;font-size:11px;letter-spacing:5px;color:#D4860A;font-style:italic;margin-top:6px;}
.biere-model-badge{display:inline-block;margin-top:10px;background:rgba(242,169,30,0.1);border:1px solid rgba(242,169,30,0.25);border-radius:20px;padding:4px 14px;font-size:12px;color:var(--gold);letter-spacing:1px;font-style:italic;}

@keyframes stream{0%{height:0;opacity:0;}8%{height:24px;opacity:1;}58%{height:24px;opacity:1;}70%{height:0;opacity:0;}100%{height:0;opacity:0;}}
@keyframes fill{0%{height:0;}65%{height:82%;}80%{height:82%;}100%{height:0;}}
@keyframes foam{0%,48%{opacity:0;transform:translateY(0);}58%{opacity:1;}75%{opacity:1;transform:translateY(-2px);}92%,100%{opacity:0;transform:translateY(-5px);}}
@keyframes bubble{0%,40%{bottom:0;opacity:0;}50%{opacity:0.8;}75%{bottom:60%;opacity:0.4;}80%,100%{opacity:0;}}

/* GENERAL */
.page{min-height:100vh;overflow-y:auto;padding-bottom:24px;}
.section-lbl{font-family:'Bebas Neue',cursive;font-size:13px;letter-spacing:4px;color:var(--mid);padding:16px 16px 8px;}
.name-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px;}
.name-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:9px 12px;color:var(--cream);}
.name-btn:active{background:rgba(242,169,30,0.08);}
.name-ava{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--gold));display:flex;align-items:center;justify-content:center;color:#1A1208;font-weight:800;font-size:13px;flex-shrink:0;}
.name-txt{flex:1;font-size:13px;font-weight:700;text-align:left;}
.name-count{font-family:'Bebas Neue',cursive;font-size:15px;color:var(--gold);}
.admin-link{display:block;margin:18px auto 8px;background:none;border:1px solid rgba(212,134,10,0.2);border-radius:10px;color:var(--mid);font-size:13px;padding:10px 28px;letter-spacing:1px;}
.login-sub{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:5px;color:var(--amber);text-align:center;padding-top:14px;}
.fut-pill{display:inline-block;background:rgba(242,169,30,0.08);border:1px solid rgba(242,169,30,0.22);border-radius:20px;padding:5px 16px;font-size:11px;color:var(--amber);letter-spacing:.5px;margin-top:6px;}

/* PIN */
.pin-wrap{padding:32px 24px;text-align:center;}
.pin-title{font-family:'Bebas Neue',cursive;font-size:22px;letter-spacing:6px;color:var(--amber);margin-bottom:24px;}
.pin-dots{display:flex;justify-content:center;gap:18px;margin-bottom:10px;}
.pin-dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(242,169,30,0.3);background:rgba(255,255,255,0.1);transition:all .2s;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:14px auto;}
.pin-btn{height:64px;border-radius:18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:var(--cream);font-family:'Bebas Neue',cursive;font-size:28px;letter-spacing:2px;}
.pin-btn:active{background:rgba(242,169,30,0.12);}
.back-txt{background:none;border:none;color:var(--mid);font-size:13px;margin-top:14px;letter-spacing:1px;}

/* HOME */
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--dark2);position:sticky;top:0;z-index:10;}
.quit-btn{background:none;border:none;color:var(--gold);font-size:13px;font-weight:700;}
.header-name{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:4px;color:var(--gold);}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.my-card{margin:14px 14px 10px;background:rgba(242,169,30,0.06);border:1px solid rgba(242,169,30,0.18);border-radius:18px;padding:20px;text-align:center;}
.my-card-lbl{font-size:10px;letter-spacing:3px;color:var(--amber);text-transform:uppercase;margin-bottom:6px;}
.my-big{font-family:'Bebas Neue',cursive;font-size:80px;color:var(--gold);line-height:1;text-shadow:0 0 30px rgba(242,169,30,0.25);}
.my-due{font-size:15px;font-weight:700;margin-top:4px;}
.my-real{font-size:11px;color:var(--mid);margin-top:3px;}
.tri-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 14px 10px;}
.tri-card{background:rgba(255,255,255,0.025);border:1px solid;border-radius:12px;padding:10px 6px;text-align:center;}
.tri-lbl{font-size:10px;color:var(--mid);margin-top:3px;letter-spacing:.5px;}
.act-col{display:flex;flex-direction:column;gap:8px;padding:0 14px;}
.act-btn{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:13px 16px;}
.act-btn:active{background:rgba(255,255,255,0.05);}
.act-gold{background:rgba(242,169,30,0.06)!important;border-color:rgba(242,169,30,0.35)!important;}
.foot-sync{text-align:center;font-size:10px;color:#3D2B1F;letter-spacing:1px;padding-top:14px;}
.fut-home-info{margin:8px 14px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:12px;padding:10px 14px;text-align:center;font-size:12px;color:var(--mid);}
.fut-home-info strong{color:var(--gold);}
.fut-biere-name{font-style:italic;color:var(--amber);font-size:13px;margin-top:2px;}

/* TOPBAR */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--dark2);position:sticky;top:0;z-index:10;}
.back-btn{background:none;border:none;color:var(--gold);font-size:13px;font-weight:700;width:70px;text-align:left;}
.top-bar-txt{font-family:'Bebas Neue',cursive;font-size:17px;letter-spacing:3px;color:var(--gold);}

/* SAISIE */
.saisie-wrap{padding:10px 12px;display:flex;flex-direction:column;gap:7px;}
.tot-banner{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;background:rgba(242,169,30,0.07);border:1px solid rgba(242,169,30,0.18);border-radius:14px;}
.day-row{border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.025);}
.day-today{background:rgba(242,169,30,0.07)!important;border-color:rgba(242,169,30,0.35)!important;}
.day-name{font-size:14px;font-weight:700;color:var(--cream);}
.today-tag{font-size:9px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-weight:800;margin-top:2px;}
.counter{display:flex;align-items:center;gap:12px;}
.btn-minus{width:44px;height:44px;border-radius:50%;border:2px solid rgba(239,154,154,0.4);background:rgba(239,154,154,0.06);color:var(--red);font-size:24px;display:flex;align-items:center;justify-content:center;padding:0;font-weight:800;}
.btn-minus:active{background:rgba(239,154,154,0.15);}
.c-val{font-family:'Bebas Neue',cursive;font-size:38px;letter-spacing:2px;min-width:36px;text-align:center;color:rgba(255,255,255,0.18);}
.c-active{color:var(--gold)!important;}
.btn-plus{width:44px;height:44px;border-radius:50%;border:2px solid rgba(129,199,116,0.4);background:rgba(129,199,116,0.06);color:var(--green);font-size:24px;display:flex;align-items:center;justify-content:center;padding:0;font-weight:800;}
.btn-plus:active{background:rgba(129,199,116,0.15);}

/* RECAP */
.scroll-wrap{padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.bloc{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:16px;overflow:hidden;}
.bloc-title{font-family:'Bebas Neue',cursive;font-size:13px;letter-spacing:3px;color:var(--amber);padding:10px 14px 6px;border-bottom:1px solid rgba(255,255,255,0.05);}
.ligne{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,0.035);}
.ligne-hi{background:rgba(242,169,30,0.05);}
.ligne-lbl{font-size:13px;color:var(--mid);}
.ligne-val{font-size:13px;font-weight:700;color:var(--cream);}
.ligne-val-hi{color:var(--gold)!important;}
.rank-row{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,0.035);}
.rank-me{background:rgba(242,169,30,0.04);}
.r-i{font-size:10px;color:#3D2B1F;width:16px;text-align:right;flex-shrink:0;}
.r-name{width:82px;font-size:12px;font-weight:700;flex-shrink:0;color:var(--cream);}
.r-bar{flex:1;height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;}
.r-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--gold));border-radius:3px;transition:width .4s;}
.r-val{font-family:'Bebas Neue',cursive;font-size:18px;width:24px;text-align:right;flex-shrink:0;}
.r-eur{font-size:10px;color:var(--mid);width:34px;text-align:right;flex-shrink:0;}

/* ADMIN */
.admin-badge{margin:10px 12px;background:rgba(242,169,30,0.07);border:1px solid rgba(242,169,30,0.22);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--amber);text-align:center;letter-spacing:.5px;}
.ap-wrap{border-bottom:1px solid rgba(255,255,255,0.04);}
.ap-row{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;}
.ap-ava{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--gold));display:flex;align-items:center;justify-content:center;color:#1A1208;font-weight:800;font-size:12px;flex-shrink:0;}
.ap-name{flex:1;font-size:13px;font-weight:700;color:var(--cream);}
.ap-tot{font-family:'Bebas Neue',cursive;font-size:16px;color:var(--gold);letter-spacing:1px;}
.ap-chev{font-size:9px;color:var(--mid);margin-left:4px;}
.ad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px 10px 12px;}
.ad-box{border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:6px 3px;text-align:center;background:rgba(255,255,255,0.02);}
.ad-today{border-color:rgba(242,169,30,0.35)!important;}
.ad-lbl{font-size:9px;color:var(--mid);margin-bottom:3px;letter-spacing:.3px;}
.ad-val{font-family:'Bebas Neue',cursive;font-size:22px;line-height:1;margin-bottom:4px;color:rgba(255,255,255,0.18);}
.ad-active{color:var(--gold)!important;}
.ad-btns{display:flex;gap:3px;justify-content:center;}
.ad-m{width:28px;height:28px;border-radius:50%;border:1px solid rgba(239,154,154,0.3);background:none;color:var(--red);font-size:16px;padding:0;display:flex;align-items:center;justify-content:center;}
.ad-p{width:28px;height:28px;border-radius:50%;border:1px solid rgba(129,199,116,0.3);background:none;color:var(--green);font-size:16px;padding:0;display:flex;align-items:center;justify-content:center;}
.reset-btn{margin:12px 14px;background:rgba(239,154,154,0.05);border:1px solid rgba(239,154,154,0.28);border-radius:10px;color:var(--red);font-size:13px;font-weight:700;letter-spacing:1px;padding:12px;width:calc(100% - 28px);}

/* CONFIG FUT admin */
.config-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.04);}
.config-lbl{font-size:13px;color:var(--cream);}
.config-input{background:rgba(255,255,255,0.07);border:1px solid rgba(242,169,30,0.3);border-radius:8px;color:var(--gold);font-size:16px;font-family:'Bebas Neue',cursive;letter-spacing:1px;padding:6px 10px;width:90px;text-align:center;}
.config-input:focus{border-color:var(--gold);}
.config-textarea{background:rgba(255,255,255,0.05);border:1px solid rgba(242,169,30,0.25);border-radius:8px;color:var(--cream);font-size:13px;padding:8px 12px;width:100%;resize:none;margin:0 14px;width:calc(100% - 28px);}
.config-textarea:focus{border-color:var(--gold);}
.config-info{padding:8px 14px;font-size:11px;color:var(--mid);font-style:italic;}
.save-config-btn{margin:10px 14px;background:rgba(129,199,116,0.08);border:1px solid rgba(129,199,116,0.3);border-radius:10px;color:var(--green);font-size:13px;font-weight:700;letter-spacing:1px;padding:11px;width:calc(100% - 28px);}
</style>
</head>
<body>

<div id="notif"></div>
<div id="loader"><div class="beer">🍺</div><p>Connexion...</p></div>
<div id="app" style="display:none;"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBdmzcmnUd4nTRS53m40ArT6WnLvgSdyew",
  authDomain: "beer-conso.firebaseapp.com",
  projectId: "beer-conso",
  storageBucket: "beer-conso.firebasestorage.app",
  messagingSenderId: "247215118379",
  appId: "1:247215118379:web:98c025e40ca9c4392db26e",
  databaseURL: "https://beer-conso-default-rtdb.europe-west1.firebasedatabase.app"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

const ADMIN_PIN = "1414";
const NAMES = [
  "Seb","Solène","Éliane","Joël","Marie Claude","Alain",
  "Marion","Ludo","Matt","Laura","David","Fabien",
  "Sophie","Diego","Sophie D","Pauline","Xavier","Rico",
  "Mag","Stephan","Laura D","Kiki","Wojtek"
];
const DAYS = [
  {s:"Mar 23",f:"Mardi 23"},{s:"Mer 24",f:"Mercredi 24"},
  {s:"Jeu 25",f:"Jeudi 25"},{s:"Ven 26",f:"Vendredi 26"},
  {s:"Lun 29",f:"Lundi 29"},{s:"Mar 30",f:"Mardi 30"}
];
const TODAY_IDX = (()=>{ const d=new Date().getDate(); const m={23:0,24:1,25:2,26:3,29:4,30:5}; return d in m?m[d]:-1; })();

let counts = {};
let config = { futPrice: 65, futLiters: 14, biereName: "" };
let isAdmin = false;
let currentUser = null;
let screen = "login";

const initCounts = ()=>{ const o={}; NAMES.forEach(n=>{o[n]=new Array(DAYS.length).fill(0);}); return o; };
counts = initCounts();

// Firebase refs
const countsRef = ref(db, "bieres/counts");
const configRef = ref(db, "bieres/config");

// Listen realtime
onValue(countsRef, snap => {
  const data = snap.val();
  if (data) NAMES.forEach(n=>{ if(Array.isArray(data[n])) counts[n]=data[n]; });
  document.getElementById("loader").style.display="none";
  document.getElementById("app").style.display="block";
  render();
});
onValue(configRef, snap => {
  const data = snap.val();
  if (data) config = { ...config, ...data };
  if (screen !== "login") render();
});

async function saveCounts(newCounts) {
  try { await set(countsRef, JSON.parse(JSON.stringify(newCounts))); } catch(e){}
}
async function saveConfig(newConfig) {
  try { await set(configRef, JSON.parse(JSON.stringify(newConfig))); } catch(e){}
}

// Helpers
const glassesPerFut = (liters)=> Math.round(((liters||config.futLiters)*100)/25);
const pricePerGlass = (price, liters)=> (price||config.futPrice) / glassesPerFut(liters||config.futLiters);
const fmtEur = n=> n.toFixed(2).replace(".",",")+"\u202f€";
const personTotal = n=> (counts[n]||[]).reduce((a,b)=>a+b,0);
const dayTotal = di=> NAMES.reduce((s,n)=>s+(counts[n]?.[di]||0),0);
const grandTotal = ()=> NAMES.reduce((s,n)=>s+personTotal(n),0);

function notify(msg, color="#81c784") {
  const el=document.getElementById("notif");
  el.textContent=msg; el.style.background=color; el.style.display="block"; el.style.opacity="1";
  clearTimeout(window._nt);
  window._nt=setTimeout(()=>{el.style.opacity="0";setTimeout(()=>el.style.display="none",300);},1800);
}

function render() {
  const app=document.getElementById("app");
  if(screen==="login")  { app.innerHTML=renderLogin();  bindLogin();  }
  if(screen==="home")   { app.innerHTML=renderHome();   bindHome();   }
  if(screen==="saisie") { app.innerHTML=renderSaisie(); bindSaisie(); }
  if(screen==="recap")  { app.innerHTML=renderRecap();  bindRecap();  }
  if(screen==="admin")  { app.innerHTML=renderAdmin();  bindAdmin();  }
}

function bindLogin() {
  let pin="";
  document.querySelectorAll(".name-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{ currentUser=btn.dataset.name; isAdmin=false; screen="home"; render(); });
  });
  document.getElementById("btn-admin-link").addEventListener("click",()=>{
    document.getElementById("btn-admin-link").style.display="none";
    document.getElementById("pin-panel").style.display="block";
  });
  document.getElementById("pin-back").addEventListener("click",()=>{
    pin=""; updatePinDots(pin,false);
    document.getElementById("btn-admin-link").style.display="block";
    document.getElementById("pin-panel").style.display="none";
    document.getElementById("pin-err").style.display="none";
  });
  document.querySelectorAll(".pin-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const d=btn.dataset.d;
      if(d==="⌫"){ pin=pin.slice(0,-1); updatePinDots(pin,false); document.getElementById("pin-err").style.display="none"; return; }
      if(pin.length>=4) return;
      pin+=d; updatePinDots(pin,false);
      if(pin.length===4){
        if(pin===ADMIN_PIN){ isAdmin=true; currentUser="Seb"; screen="home"; render(); }
        else{ updatePinDots(pin,true); document.getElementById("pin-err").style.display="block"; setTimeout(()=>{ pin=""; updatePinDots(pin,false); document.getElementById("pin-err").style.display="none"; },700); }
      }
    });
  });
}

function updatePinDots(pin,err) {
  document.querySelectorAll(".pin-dot").forEach((dot,i)=>{
    dot.style.background=pin.length>i?"var(--gold)":"rgba(255,255,255,0.1)";
    dot.style.boxShadow=pin.length>i?"0 0 12px rgba(242,169,30,0.5)":"none";
    dot.style.borderColor=err?"rgba(239,154,154,0.6)":"rgba(242,169,30,0.3)";
  });
}

function bindSaisie() {
  document.getElementById("btn-back").addEventListener("click",()=>{ screen="home"; render(); });
  document.querySelectorAll(".btn-minus,.btn-plus").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      const name=btn.dataset.name, di=parseInt(btn.dataset.di), delta=btn.classList.contains("btn-plus")?1:-1;
      counts[name]=counts[name]||new Array(DAYS.length).fill(0);
      counts[name][di]=Math.max(0,(counts[name][di]||0)+delta);
      await saveCounts(counts);
      const el=document.getElementById(`val-${di}`);
      if(el){ el.textContent=counts[name][di]; el.className="c-val"+(counts[name][di]>0?" c-active":""); }
      const tot=(counts[name]||[]).reduce((a,b)=>a+b,0);
      const totEl=document.getElementById("tot-val");
      if(totEl) totEl.textContent=`${tot} 🍺 · ${tot},00\u202f€`;
      notify(delta>0?"+1 🍺":"−1 🍺",delta>0?"#81c784":"#ef9a9a");
    });
  });
}

  const updateCalc=()=>{
    const p=parseFloat(document.getElementById("cfg-price").value)||65;
    const l=parseFloat(document.getElementById("cfg-liters").value)||14;
    const g=Math.round((l*100)/25);
    const ppg=(p/g).toFixed(2).replace(".",",")+"\u202f€";
    document.getElementById("cfg-calc").innerHTML=`Verres (~25cl)\u202f: <strong style="color:var(--gold)">${g}</strong> · Prix réel\u202f: <strong style="color:var(--gold)">${ppg}</strong>`;
  };
  document.getElementById("cfg-price").addEventListener("input",updateCalc);
  document.getElementById("cfg-liters").addEventListener("input",updateCalc);

  // Toggle fut2
  document.getElementById("cfg-fut2-active").addEventListener("change",function(){
    document.getElementById("fut2-fields").style.display=this.checked?"block":"none";
  });

  // Live calc fut2
  const updateCalc2=()=>{
    const p2=parseFloat(document.getElementById("cfg-price2").value)||65;
    const l2=parseFloat(document.getElementById("cfg-liters2").value)||14;
    const g2=Math.round((l2*100)/25);
    const ppg2=(p2/g2).toFixed(2).replace(".",",")+"\u202f€";
    document.getElementById("cfg-calc2").innerHTML=`Verres (~25cl)\u202f: <strong style="color:#64b5f6;">${g2}</strong> · Prix réel\u202f: <strong style="color:#64b5f6;">${ppg2}</strong>`;
  };
  document.getElementById("cfg-price2").addEventListener("input",updateCalc2);
  document.getElementById("cfg-liters2").addEventListener("input",updateCalc2);

  // Save config
  document.getElementById("btn-save-config").addEventListener("click",async()=>{
    const fut2Active=document.getElementById("cfg-fut2-active").checked;
    const newConfig={
      futPrice: parseFloat(document.getElementById("cfg-price").value)||65,
      futLiters: parseFloat(document.getElementById("cfg-liters").value)||14,
      biereName: document.getElementById("cfg-biere").value.trim(),
      fut2Active: fut2Active,
      fut2Price: parseFloat(document.getElementById("cfg-price2").value)||65,
      fut2Liters: parseFloat(document.getElementById("cfg-liters2").value)||14,
      fut2Name: document.getElementById("cfg-biere2").value.trim()
    };
    config={...newConfig};
    await saveConfig(newConfig);
    notify("Configuration sauvegardée ✓","#81c784");
  });

  // Accordion
  document.querySelectorAll(".ap-row").forEach(row=>{
    row.addEventListener("click",()=>{
      const name=row.dataset.person, key=name.replace(/\s/g,"_");
      const grid=document.getElementById(`grid-${key}`), chev=document.getElementById(`chev-${key}`);
      const open=grid.style.display!=="none";
      document.querySelectorAll(".ad-grid").forEach(g=>g.style.display="none");
      document.querySelectorAll(".ap-chev").forEach(c=>c.textContent="▼");
      if(!open){ grid.style.display="grid"; chev.textContent="▲"; }
    });
  });

  // +/- admin
  document.querySelectorAll(".ad-m,.ad-p").forEach(btn=>{
    btn.addEventListener("click",async(e)=>{
      e.stopPropagation();
      const name=btn.dataset.name, di=parseInt(btn.dataset.di), delta=btn.classList.contains("ad-p")?1:-1;
      counts[name]=counts[name]||new Array(DAYS.length).fill(0);
      counts[name][di]=Math.max(0,(counts[name][di]||0)+delta);
      await saveCounts(counts);
      const key=name.replace(/\s/g,"_");
      const el=document.getElementById(`adv-${key}-${di}`);
      if(el){ el.textContent=counts[name][di]; el.className="ad-val"+(counts[name][di]>0?" ad-active":""); }
      const tot=(counts[name]||[]).reduce((a,b)=>a+b,0);
      const totEl=document.getElementById(`apt-${key}`);
      if(totEl) totEl.textContent=`${tot}🍺·${tot}€`;
      notify(delta>0?`+1 🍺 (${name})`:`−1 🍺 (${name})`,delta>0?"#81c784":"#ef9a9a");
    });
  });

  document.getElementById("btn-reset").addEventListener("click",async()=>{
    if(!confirm("Réinitialiser TOUS les compteurs ?")) return;
    counts=initCounts();
    await saveCounts(counts);
    notify("Réinitialisé ✓","#ef9a9a");
    render();
  });
}
</script>
</body>
</html>
